services:
  - type: web
    name: machine-maintenance-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: machine-maintenance-db
          property: connectionString

  - type: web
    name: machine-maintenance-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/build"
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: REACT_APP_API_URL
        # Replace this with the actual backend URL generated by Render after the first deploy
        # Or let Render evaluate it if it supports `property: url` on your account.
        value: "https://machine-maintenance-backend.onrender.com" 

databases:
  - name: machine-maintenance-db
    databaseName: machines
    user: admin
